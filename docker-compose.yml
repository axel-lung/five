services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: five_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: five
      POSTGRES_USER: five_user
      POSTGRES_PASSWORD: five_password_${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/db.init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U five_user -d five"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: five_minio
    restart: unless-stopped
    command: server /data --address ":6010" --console-address ":6011"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_${MINIO_PASSWORD:-changeme}
    expose:
      - "6010"
      - "6011"
    ports:
      - "127.0.0.1:6011:6011"   # console, accessible en local uniquement (ssh -L pour y accéder)
    volumes:
      - minio_data:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js/TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: five_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://five_user:five_password_${DB_PASSWORD:-changeme}@db:5432/five
      - MINIO_ENDPOINT=minio:6010
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_${MINIO_PASSWORD:-changeme}
      - MINIO_USE_SSL=false
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être defini dans .env}
      - NODE_ENV=production
      - PORT=6010
    expose:
      - "6010"
    ports:
      - "127.0.0.1:6010:6010"   # debug en local uniquement ; le trafic public passe par Traefik
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.five-api.rule=Host(`five.alng.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.five-api.entrypoints=websecure"
      - "traefik.http.routers.five-api.tls=true"
      - "traefik.http.routers.five-api.tls.certresolver=myresolver"
      - "traefik.http.routers.five-api.priority=20"
      - "traefik.http.services.five-api.loadbalancer.server.port=6010"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://five.alng.fr/api
    container_name: five_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.five-frontend.rule=Host(`five.alng.fr`)"
      - "traefik.http.routers.five-frontend.entrypoints=websecure"
      - "traefik.http.routers.five-frontend.tls=true"
      - "traefik.http.routers.five-frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.five-frontend.priority=1"
      - "traefik.http.services.five-frontend.loadbalancer.server.port=80"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 et non localhost : nginx est en `listen 80` (IPv4 seul), or
      # localhost peut resoudre vers ::1 dans le conteneur.
      # Le test -f verifie en plus que le build Vite est bien present : un
      # healthcheck qui ne testerait que /health passerait avec un dossier vide.
      # Attention : Traefik retire du routage un conteneur unhealthy.
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # Reseau du Traefik deja en place sur le serveur (cree hors de ce projet).
  # Doit correspondre au reseau reellement utilise par ton Traefik.
  traefik:
    name: traefik
    external: true

volumes:
  postgres_data:
  minio_data:
