version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: five_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: five
      POSTGRES_USER: five_user
      POSTGRES_PASSWORD: five_password_${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/db.init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U five_user -d five"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: five_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_${MINIO_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js/TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: five_backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql://five_user:${DB_PASSWORD:-changeme}@db:5432/five
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-changeme}
      - MINIO_USE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_this_in_production}
      - NODE_ENV=development
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/package.json:/usr/src/app/package.json
      - ./backend/tsconfig.json:/usr/src/app/tsconfig.json
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spare", "http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: five_frontend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/usr/src/app/src
      - ./frontend/package.json:/usr/src/app/package.json
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spare", "http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: five_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/build:/usr/share/nginx/html:ro  # For production build
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  minio_data: