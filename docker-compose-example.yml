version: "3.8"

services:
  rod:
    image: php:8.2-apache
    container_name: www
    labels:
      - "traefik.enable=true"

      # --- Routeur principal : www.alng.fr ---
      - "traefik.http.routers.www.rule=Host(`www.alng.fr`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls=true"
      - "traefik.http.routers.www.tls.certresolver=myresolver"

      # --- Middleware de redirection apex -> www ---
      - "traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https?://alng\\.fr/(.*)"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.alng.fr/$${1}"
      - "traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true"

      # --- Routeur de redirection : alng.fr ---
      - "traefik.http.routers.apex.rule=Host(`alng.fr`)"
      - "traefik.http.routers.apex.entrypoints=websecure"
      - "traefik.http.routers.apex.tls=true"
      - "traefik.http.routers.apex.tls.certresolver=myresolver"
      - "traefik.http.routers.apex.middlewares=redirect-to-www"
      - "traefik.http.routers.apex.service=noop@internal"

      # --- Service ---
      - "traefik.http.services.www.loadbalancer.server.port=80"

    volumes:
      - ./volumes/data:/var/www/html
    restart: unless-stopped
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    external: true