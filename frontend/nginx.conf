server {
    listen 80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Endpoint interne pour le healthcheck Docker (pas de log)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les assets Vite sont hashes : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback : index.html ne doit jamais etre mis en cache
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
