# Traefik static configuration
# This file is mounted into the traefik container

# Enable the dashboard and API (insecure for demo, secure in production)
api:
  insecure: true
  dashboard: true

# EntryPoints
entryPoints:
  web:
    address: ":80"
    # Redirect to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# Providers
providers:
  docker:
    exposedByDefault: false  # Don't expose containers by default, rely on labels
    network: five-network
  file:
    filename: /traefik_dynamic.yml  # We won't use this for now, but can be used for dynamic config

# Certificates resolvers (for Let's Encrypt)
certificatesResolvers:
  myresolver:
    acme:
      email: admin@alng.fr  # Change to your email
      storage: /acme.json
      tlsChallenge: {}

# Logging
log:
  level: INFO
  format: common

# AccessLog
accessLog:
  format: common